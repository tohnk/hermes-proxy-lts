name: Build Proxy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --configuration Release
      - name: Publish
        run: dotnet publish HermesProxy/HermesProxy.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained --output artifacts/${{ matrix.rid }}
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar -czf artifacts/HermesProxy-linux-x64.tar.gz -C artifacts linux-x64
      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: HermesProxy-linux-x64
          path: artifacts/HermesProxy-linux-x64.tar.gz
          if-no-files-found: error
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: HermesProxy-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
